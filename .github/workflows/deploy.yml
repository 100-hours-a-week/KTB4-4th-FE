name: Deploy Frontend to V2 ECS

on:
  workflow_call:
    inputs:
      environment:
        description: "배포할 V2 환경"
        required: true
        type: string
      github_environment:
        description: "배포 승인과 OIDC 인증에 사용할 GitHub Environment"
        required: true
        type: string
      image_sha:
        description: "V2 ECR 이미지 태그에 사용할 Git SHA"
        required: true
        type: string
      verify_dev_match:
        description: "Dev 검증 이미지 일치 여부 확인"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: need-u/frontend
  ECR_REPOSITORY_URI: ${{ vars.AWS_ECR_REPOSITORY_URI }}

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.github_environment }}

    permissions:
      contents: read
      actions: read
      id-token: write

    concurrency:
      group: deploy-${{ inputs.environment }}-frontend
      cancel-in-progress: false

    steps:
      - name: Validate Inputs
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          GITHUB_ENVIRONMENT: ${{ inputs.github_environment }}
          IMAGE_SHA: ${{ inputs.image_sha }}
          AWS_CD_ROLE_ARN: ${{ vars.AWS_CD_ROLE_ARN }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_ENVIRONMENT" =~ ^(dev|staging|prod)$ ]]; then
            echo "::error::지원하지 않는 배포 환경입니다."
            exit 1
          fi

          if [[ "$GITHUB_ENVIRONMENT" != "$DEPLOY_ENVIRONMENT" ]]; then
            echo "::error::배포 환경과 GitHub Environment가 일치하지 않습니다."
            exit 1
          fi

          if [[ ! "$IMAGE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::이미지 SHA는 40자리 Git SHA여야 합니다."
            exit 1
          fi

          if [[ -z "$AWS_CD_ROLE_ARN" ]]; then
            echo "::error::AWS_CD_ROLE_ARN이 필요합니다."
            exit 1
          fi

          if [[ -z "$ECR_REPOSITORY_URI" ]]; then
            echo "::error::AWS_ECR_REPOSITORY_URI가 필요합니다."
            exit 1
          fi

          {
            echo "DEPLOY_ENVIRONMENT=$DEPLOY_ENVIRONMENT"
            echo "IMAGE_SHA=$IMAGE_SHA"
            echo "IMAGE_TAG=v2-$IMAGE_SHA"
            echo "EXPECTED_IMAGE=$ECR_REPOSITORY_URI:v2-$IMAGE_SHA"
          } >> "$GITHUB_ENV"

      - name: Checkout for Prod Verification
        if: inputs.environment == 'prod'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify SHA Included in Main
        if: inputs.environment == 'prod'
        shell: bash
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        run: |
          set -euo pipefail

          git fetch origin \
            +refs/heads/main:refs/remotes/origin/main

          if ! git cat-file -e "${IMAGE_SHA}^{commit}" 2>/dev/null; then
            echo "::error::입력한 SHA가 존재하지 않습니다."
            exit 1
          fi

          if ! git merge-base --is-ancestor \
            "$IMAGE_SHA" refs/remotes/origin/main; then
            echo "::error::해당 SHA가 Main 브랜치에 포함되지 않았습니다."
            exit 1
          fi

          echo "Main SHA 검증 완료: $IMAGE_SHA"

      - name: Verify Successful Dev Deployment
        if: inputs.environment == 'prod'
        uses: actions/github-script@v7
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = process.env.IMAGE_SHA;

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: "frontend-ci.yml",
                branch: "dev",
                event: "push",
                head_sha: sha,
                per_page: 100
              }
            );

            const successfulRuns = runs.filter(run =>
              run.head_sha === sha &&
              run.event === "push" &&
              run.head_branch === "dev" &&
              run.conclusion === "success"
            );

            if (successfulRuns.length === 0) {
              core.setFailed(
                `동일 SHA의 Dev CI 성공 이력이 없습니다: ${sha}`
              );
              return;
            }

            let verified = false;

            for (const run of successfulRuns) {
              const jobs = await github.paginate(
                github.rest.actions.listJobsForWorkflowRun,
                {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100
                }
              );

              const deployJob = jobs.find(job =>
                (
                  job.name === "Deploy V2 Dev" ||
                  job.name.startsWith("Deploy V2 Dev /")
                ) &&
                job.conclusion === "success"
              );

              if (deployJob) {
                core.info(`Dev 배포 성공 확인: ${sha}`);
                core.info(`Workflow: ${run.html_url}`);
                verified = true;
                break;
              }
            }

            if (!verified) {
              core.setFailed(
                `동일 SHA의 Dev ECS 배포 성공 Job을 확인하지 못했습니다: ${sha}`
              );
            }

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve Deployment Resources
        shell: bash
        run: |
          set -euo pipefail

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          if [[ "$DEPLOY_ENVIRONMENT" == "prod" && "$ACCOUNT_ID" != "919551759796" ]]; then
            echo "::error::Prod AWS Account가 일치하지 않습니다."
            exit 1
          fi

          if [[ "$DEPLOY_ENVIRONMENT" == "prod" ]]; then
            EXPECTED_REPOSITORY_URI="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

            if [[ "$ECR_REPOSITORY_URI" != "$EXPECTED_REPOSITORY_URI" ]]; then
              echo "::error::Prod ECR Repository URI가 일치하지 않습니다."
              exit 1
            fi
          fi

          {
            echo "ECS_CLUSTER=needu-$DEPLOY_ENVIRONMENT-cluster"
            echo "ECS_SERVICE=needu-$DEPLOY_ENVIRONMENT-frontend"
            echo "BASE_TASK_DEFINITION_PARAMETER=/needu/v2/$DEPLOY_ENVIRONMENT/ecs/frontend/base-task-definition-arn"
          } >> "$GITHUB_ENV"

      - name: Verify ECR Image
        shell: bash
        run: |
          set -euo pipefail

          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --region "$AWS_REGION" \
            >/dev/null

          echo "ECR 이미지 확인 완료: $EXPECTED_IMAGE"

      - name: Verify Dev Image
        if: inputs.verify_dev_match
        shell: bash
        run: |
          set -euo pipefail

          DEV_STATE=$(aws ecs describe-services \
            --cluster needu-dev-cluster \
            --services needu-dev-frontend \
            --region "$AWS_REGION")

          jq -e '
            (.failures | length) == 0 and
            (.services | length) == 1 and
            .services[0].status == "ACTIVE"
          ' <<< "$DEV_STATE" >/dev/null || {
            echo "::error::Dev ECS 서비스를 확인할 수 없습니다."
            exit 1
          }

          DEV_TASK_DEFINITION_ARN=$(jq -r \
            '.services[0].taskDefinition' <<< "$DEV_STATE")

          DEV_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$DEV_TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            --query "taskDefinition.containerDefinitions[?name=='frontend'].image | [0]" \
            --output text)

          if [[ "$DEV_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "::error::Dev 이미지와 요청 이미지가 다릅니다."
            echo "Dev: $DEV_IMAGE"
            echo "Requested: $EXPECTED_IMAGE"
            exit 1
          fi

          echo "Dev 이미지 일치 확인 완료"

      - name: Verify ECS Service
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_STATE=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION")

          jq -e '
            (.failures | length) == 0 and
            (.services | length) == 1 and
            .services[0].status == "ACTIVE"
          ' <<< "$SERVICE_STATE" >/dev/null || {
            echo "::error::ECS 서비스가 없거나 ACTIVE 상태가 아닙니다."
            exit 1
          }

          DESIRED_COUNT=$(jq -r \
            '.services[0].desiredCount' <<< "$SERVICE_STATE")

          echo "ECS 서비스 확인 완료: $ECS_SERVICE"
          echo "현재 Desired Count: $DESIRED_COUNT"

      - name: Create Task Definition Revision
        id: task-definition
        shell: bash
        run: |
          set -euo pipefail

          BASE_TASK_DEFINITION_ARN=$(aws ssm get-parameter \
            --name "$BASE_TASK_DEFINITION_PARAMETER" \
            --region "$AWS_REGION" \
            --query 'Parameter.Value' \
            --output text)

          if [[ -z "$BASE_TASK_DEFINITION_ARN" || "$BASE_TASK_DEFINITION_ARN" == "None" ]]; then
            echo "::error::Base Task Definition ARN을 찾을 수 없습니다."
            exit 1
          fi

          aws ecs describe-task-definition \
            --task-definition "$BASE_TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            --query 'taskDefinition' \
            > task-definition.json

          MATCH_COUNT=$(jq \
            '[.containerDefinitions[] | select(.name == "frontend")] | length' \
            task-definition.json)

          if [[ "$MATCH_COUNT" -ne 1 ]]; then
            echo "::error::frontend 컨테이너가 없거나 중복되었습니다."
            exit 1
          fi

          jq --arg image "$EXPECTED_IMAGE" '
            .containerDefinitions |= map(
              if .name == "frontend" then
                .image = $image
              else
                .
              end
            )
            | del(
                .taskDefinitionArn,
                .revision,
                .status,
                .requiresAttributes,
                .compatibilities,
                .registeredAt,
                .registeredBy,
                .deregisteredAt
              )
          ' task-definition.json > task-definition-deploy.json

          NEW_TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-deploy.json \
            --region "$AWS_REGION" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          if [[ -z "$NEW_TASK_DEFINITION_ARN" || "$NEW_TASK_DEFINITION_ARN" == "None" ]]; then
            echo "::error::Task Definition 등록에 실패했습니다."
            exit 1
          fi

          echo "task_definition_arn=$NEW_TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"
          echo "Task Definition 등록 완료: $NEW_TASK_DEFINITION_ARN"

      - name: Deploy ECS Service
        shell: bash
        env:
          TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            >/dev/null

          SERVICE_STATE=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION")

          DESIRED_COUNT=$(jq -r \
            '.services[0].desiredCount' <<< "$SERVICE_STATE")

          if [[ ! "$DESIRED_COUNT" =~ ^[0-9]+$ ]]; then
            echo "::error::Desired Count 조회 결과가 올바르지 않습니다."
            exit 1
          fi

          if [[ "$DESIRED_COUNT" -eq 0 ]]; then
            echo "Desired Count=0: ECS 안정화 대기를 생략합니다."
            echo "Task Definition과 이미지 반영을 검증합니다."
          else
            echo "Desired Count=$DESIRED_COUNT: ECS 안정화 대기"

            aws ecs wait services-stable \
              --cluster "$ECS_CLUSTER" \
              --services "$ECS_SERVICE" \
              --region "$AWS_REGION"
          fi

      - name: Verify Deployment
        shell: bash
        env:
          EXPECTED_TASK_DEFINITION_ARN: ${{ steps.task-definition.outputs.task_definition_arn }}
        run: |
          set -euo pipefail

          SERVICE_STATE=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --region "$AWS_REGION")

          jq -e '
            (.failures | length) == 0 and
            (.services | length) == 1 and
            .services[0].status == "ACTIVE"
          ' <<< "$SERVICE_STATE" >/dev/null || {
            echo "::error::ECS 서비스 상태 확인에 실패했습니다."
            exit 1
          }

          CURRENT_TASK_DEFINITION_ARN=$(jq -r \
            '.services[0].taskDefinition' <<< "$SERVICE_STATE")
          DESIRED_COUNT=$(jq -r \
            '.services[0].desiredCount' <<< "$SERVICE_STATE")
          RUNNING_COUNT=$(jq -r \
            '.services[0].runningCount' <<< "$SERVICE_STATE")

          if [[ "$CURRENT_TASK_DEFINITION_ARN" != "$EXPECTED_TASK_DEFINITION_ARN" ]]; then
            echo "::error::요청한 Task Definition이 ECS 서비스에 반영되지 않았습니다."
            exit 1
          fi

          ACTUAL_IMAGE=$(aws ecs describe-task-definition \
            --task-definition "$CURRENT_TASK_DEFINITION_ARN" \
            --region "$AWS_REGION" \
            --query "taskDefinition.containerDefinitions[?name=='frontend'].image | [0]" \
            --output text)

          if [[ "$ACTUAL_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "::error::Task Definition 이미지가 요청 이미지와 다릅니다."
            echo "Expected: $EXPECTED_IMAGE"
            echo "Actual: $ACTUAL_IMAGE"
            exit 1
          fi

          if [[ "$DESIRED_COUNT" -eq 0 ]]; then
            if [[ "$RUNNING_COUNT" -ne 0 ]]; then
              echo "::error::Desired Count=0이지만 실행 중인 Task가 있습니다."
              exit 1
            fi

            echo "Frontend V2 배포 완료: 서비스 정지 상태에서 이미지 배포 완료"
            echo "Task Definition: $CURRENT_TASK_DEFINITION_ARN"
            echo "Image: $ACTUAL_IMAGE"
            echo "실제 ECS 기동은 Prod Runtime Control에서 수행합니다."
            exit 0
          fi

          if [[ "$RUNNING_COUNT" -lt "$DESIRED_COUNT" ]]; then
            echo "::error::실행 중인 Task 수가 부족합니다: $RUNNING_COUNT/$DESIRED_COUNT"
            exit 1
          fi

          echo "Frontend V2 배포 완료: $RUNNING_COUNT/$DESIRED_COUNT"
          echo "Task Definition: $CURRENT_TASK_DEFINITION_ARN"
          echo "Image: $ACTUAL_IMAGE"
