name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: need-u/frontend

jobs:
  # =========================================================
  # PR / Push 공통 기본 검증
  # =========================================================
  check:
    name: Type Check, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Next.js Types
        run: npx next typegen

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Production Build
        env:
          # PR 검증에서는 실제 운영 Parameter를 사용하지 않는다.
          BACKEND_API_BASE_URL: http://127.0.0.1:8080/
        run: npm run build

  # =========================================================
  # dev -> main PR Docker Build 검증
  # =========================================================
  docker-build-check:
    name: Docker Build Check
    needs: check
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Build Check
        env:
          BACKEND_API_BASE_URL: http://127.0.0.1:8080/
        run: |
          docker build \
            --build-arg BACKEND_API_BASE_URL="$BACKEND_API_BASE_URL" \
            -t needu-frontend:ci-check \
            .

  # =========================================================
  # main Push -> Production Image Build & ECR Push
  # =========================================================
  ecr-push:
    name: Build & Push to ECR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub Actions -> AWS OIDC 인증
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NEEDU_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Parameter Store의 Frontend 설정값을 GitHub Actions 환경변수로 등록
      - name: Load Frontend Parameters
        shell: bash
        run: |
          while IFS=$'\t' read -r name value; do
            if [ -n "$name" ]; then
              key="$(basename "$name")"

              # GitHub Actions Log에 값이 노출되지 않도록 Masking
              echo "::add-mask::$value"

              # 이후 Step에서 환경변수로 사용할 수 있도록 등록
              echo "$key=$value" >> "$GITHUB_ENV"
            fi
          done < <(
            aws ssm get-parameters-by-path \
              --region "$AWS_REGION" \
              --path "/needu/prod/frontend" \
              --recursive \
              --with-decryption \
              --query 'Parameters[*].[Name,Value]' \
              --output text
          )

      # 필수 Parameter가 제대로 들어왔는지만 확인
      # 실제 값은 출력하지 않는다.
      - name: Validate Frontend Parameters
        shell: bash
        run: |
          : "${BACKEND_API_BASE_URL:?BACKEND_API_BASE_URL is required}"
          : "${NEXT_PUBLIC_SENTRY_DSN:?NEXT_PUBLIC_SENTRY_DSN is required}"
          : "${SENTRY_ORG:?SENTRY_ORG is required}"
          : "${SENTRY_PROJECT:?SENTRY_PROJECT is required}"
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN is required}"

          echo "Frontend parameters loaded successfully."

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_BUILDKIT: 1
        run: |
          docker build \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg BACKEND_API_BASE_URL="$BACKEND_API_BASE_URL" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN" \
            --build-arg SENTRY_ORG="$SENTRY_ORG" \
            --build-arg SENTRY_PROJECT="$SENTRY_PROJECT" \
            --build-arg SENTRY_RELEASE="$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .

      - name: Push Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
