name: Frontend CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: need-u/frontend

jobs:
  check:
    name: Format Check, Type Check, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Format Check
        run: npm run format:check

      - name: Generate Next.js Types
        run: npx next typegen

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Production Build
        run: npm run build

  # =========================================================
  # PR -> Dev: Docker Build Check
  # =========================================================
  docker-build-check:
    name: Docker Build Check
    needs: check
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Build Check
        run: |
          docker build \
            -t needu-frontend:ci-check \
            .

  # =========================================================
  # V1: main Push -> SHA Image
  # =========================================================
  v1-ecr-push:
    name: Build & Push V1 Image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.NEEDU_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load V1 Frontend Parameters
        shell: bash
        run: |
          set -euo pipefail

          for key in \
            BACKEND_API_BASE_URL \
            NEXT_PUBLIC_SENTRY_DSN \
            SENTRY_ORG \
            SENTRY_PROJECT \
            SENTRY_AUTH_TOKEN
          do
            value=$(aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "/needu/prod/frontend/$key" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text)

            if [[ -z "$value" || "$value" == "None" ]]; then
              echo "Missing V1 parameter: $key"
              exit 1
            fi

            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build V1 Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg BACKEND_API_BASE_URL="$BACKEND_API_BASE_URL" \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN" \
            --build-arg SENTRY_ORG="$SENTRY_ORG" \
            --build-arg SENTRY_PROJECT="$SENTRY_PROJECT" \
            --build-arg SENTRY_RELEASE="$IMAGE_SHA" \
            -t "$REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA" \
            .

      - name: Push V1 Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:$IMAGE_SHA"

  # =========================================================
  # V2: dev Push -> v2-SHA Image
  # =========================================================
  v2-ecr-push:
    name: Build & Push V2 Image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load V2 Frontend Parameters
        shell: bash
        run: |
          set -euo pipefail

          for key in \
            NEXT_PUBLIC_SENTRY_DSN \
            SENTRY_ORG \
            SENTRY_PROJECT \
            SENTRY_AUTH_TOKEN
          do
            value=$(aws ssm get-parameter \
              --region "$AWS_REGION" \
              --name "/needu/common/frontend-build/$key" \
              --with-decryption \
              --query 'Parameter.Value' \
              --output text)

            if [[ -z "$value" || "$value" == "None" ]]; then
              echo "Missing V2 parameter: $key"
              exit 1
            fi

            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build V2 Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --secret id=sentry_auth_token,env=SENTRY_AUTH_TOKEN \
            --build-arg NEXT_PUBLIC_SENTRY_DSN="$NEXT_PUBLIC_SENTRY_DSN" \
            --build-arg SENTRY_ORG="$SENTRY_ORG" \
            --build-arg SENTRY_PROJECT="$SENTRY_PROJECT" \
            --build-arg SENTRY_RELEASE="$IMAGE_SHA" \
            -t "$REGISTRY/$ECR_REPOSITORY:v2-$IMAGE_SHA" \
            .

      - name: Push V2 Docker Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          docker push \
            "$REGISTRY/$ECR_REPOSITORY:v2-$IMAGE_SHA"

  # =========================================================
  # V2 Dev: ECR Push 성공 후 ECS 자동 배포
  # =========================================================
  deploy-dev:
    name: Deploy V2 Dev
    needs: v2-ecr-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'

    permissions:
      contents: read
      actions: read
      id-token: write

    uses: ./.github/workflows/deploy.yml

    with:
      environment: dev
      github_environment: dev
      image_sha: ${{ github.sha }}

    secrets: inherit
