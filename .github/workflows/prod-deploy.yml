name: Frontend V2 Production CD

on:
  workflow_dispatch:
    inputs:
      image_sha:
        description: "Dev에서 검증하고 Main에 포함된 V2 이미지 SHA (40자리)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy V2 Production

    permissions:
      contents: read
      actions: read
      id-token: write

    uses: ./.github/workflows/deploy.yml

    with:
      environment: prod
      github_environment: prod
      image_sha: ${{ inputs.image_sha }}
      verify_dev_match: true

    secrets: inherit

  record-production-deployment:
    name: Record Production Image Deployment
    needs: deploy-prod
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Deployed Commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.image_sha }}
          fetch-depth: 0

      - name: Create Production Tag
        env:
          IMAGE_SHA: ${{ inputs.image_sha }}
        shell: bash
        run: |
          set -euo pipefail

          PRODUCTION_TAG="prod-$(TZ=Asia/Seoul date +%Y%m%d)-${GITHUB_RUN_NUMBER}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "$PRODUCTION_TAG" "$IMAGE_SHA" \
            -m "Production image deployment $PRODUCTION_TAG"

          git push origin "$PRODUCTION_TAG"
